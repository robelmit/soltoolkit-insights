name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          path: soltoolkit-insights
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/soltoolkit-sdk
          path: soltoolkit-sdk
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: soltoolkit-insights/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install && pnpm build
        working-directory: soltoolkit-sdk
      - run: pnpm install && pnpm check
        working-directory: soltoolkit-insights
